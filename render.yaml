# CodeForge AI — Render single Web Service (one process, one public URL).
#
# The Node server serves BOTH the built Vite frontend (dist/) and the JSON API
# (/api/agent/*), so the browser calls the API same-origin — no CORS, no second
# service, no hardcoded host.
#
# Blueprint deploys read this file automatically. If you configured the service
# by hand in the dashboard, just mirror buildCommand / startCommand below.

services:
  - type: web
    name: codeforge-ai
    runtime: node
    plan: free

    # Installs dependencies (devDeps included — vite is needed to build) and
    # produces dist/. Render sets NODE_ENV=production, which makes `npm install`
    # skip devDependencies, so `--include=dev` is required for the build to work.
    buildCommand: npm install --include=dev && npm run build

    # Boots server/index.js via the root entrypoint. Binds process.env.PORT.
    startCommand: node index.js

    healthCheckPath: /api/agent/status

    envVars:
      # ─────────────────────────────────────────────────────────────────
      #  SECRETS: set these in the Render dashboard, never in this file.
      #  sync:false means "prompt me, do not store the value in git".
      # ─────────────────────────────────────────────────────────────────
      - key: OPENAI_API_KEY
        sync: false

      - key: AI_PROVIDER
        value: openai

      - key: OPENAI_MODEL
        value: gpt-4o

      # Lock browser origins to this service once you know the URL, e.g.
      # https://codeforge-ai.onrender.com
      - key: CORS_ORIGIN
        value: "*"

      - key: RATE_LIMIT_PER_MINUTE
        value: "30"

      - key: NODE_VERSION
        value: "20"
